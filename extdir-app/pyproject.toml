[project]
name = "extdir-app"
version = "0.1.0"
description = "分機通訊錄"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # B008: FastAPI 的 Depends() 預設參數是標準寫法；E501: 中文全形字寬度不好算

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
