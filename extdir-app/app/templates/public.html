{% extends "base.html" %}{% block title %}找分機{% endblock %}
{% block body %}
<h1>找分機</h1>
<p class="muted">輸入姓名、部門或分機號碼；也可以搜尋會議室、守衛室等單位。</p>
<input id="q" type="search" placeholder="例如：品保、守衛室、211、陳文斌" autofocus>

<p id="count" class="muted"></p>
<script src="/static/public.js"></script>
{% endblock %}
