{% extends "base.html" %}{% block title %}異動紀錄{% endblock %}
{% block body %}<h1>異動紀錄</h1>
<table><thead><tr><th>時間</th><th>誰</th><th>動作</th><th>對象</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{ r.at.strftime('%Y-%m-%d %H:%M') }}</td><td>{{ r.actor }}</td><td>{{ r.action }}</td><td>{{ r.target }}</td></tr>{% endfor %}</tbody></table>
<p>{% for n in range(1, pages+1) %}<a href="?page={{ n }}" {{ 'class=cur' if n==page }}>{{ n }}</a> {% endfor %}</p>{% endblock %}
