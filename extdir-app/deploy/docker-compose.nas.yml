# 專案名稱與映像名稱必須與 EC Portal 不同，否則 `up -d` 可能把 EC Portal 的容器換掉
name: extdir-web
services:
  portal:
    image: extdir-app:nas
    build:
      context: ..
    container_name: extdir-web-portal
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORTAL_HTTP_PORT:-8002}:8000"   # EC Portal 用 8000／8443；本站用 8002，使用者連 DSM 反向代理的 8445
